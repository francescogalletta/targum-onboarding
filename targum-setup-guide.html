<title>Targum Setup Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column; a yellow "tape" band marks the active step, like a timeline scrubber. */
:root{
  --yellow:#FBDE4B; --yellow-deep:#E7C51D; --ink:#141311; --ink-2:#4C4A42; --ink-3:#8A877B;
  --bg:#FFFDF5; --surface:#FFFFFF; --line:#E9E4CF; --line-2:#D6D0B3;
  --fg:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3);
  --ok:#1F7A4D; --warn:#A8600A;
  --font-display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",sans-serif;
  --font-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px; --shadow:0 1px 0 rgba(20,19,17,.05),0 10px 30px -12px rgba(20,19,17,.18); color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .t{width:34px;height:34px;border-radius:9px;background:var(--yellow);color:#141311;display:grid;place-items:center;font-size:20px;font-weight:800}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.navfw{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);border-radius:999px;padding:6px 12px 6px 12px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;color:var(--fg);transition:border-color .15s,background .2s}
.navfw:hover{border-color:var(--fg)}
.navfw .cnt{font-family:var(--font-mono);font-size:12px;background:var(--ink);color:var(--yellow);padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.navfw[aria-current="page"]{background:var(--yellow);border-color:var(--yellow-deep)}
.navfw[aria-current="page"] .cnt{background:#141311}

/* Progress tape */
.tape{display:flex;gap:6px;margin:22px 0 8px}
.tape span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.tape span.on{background:var(--yellow)}
.tape span.done{background:var(--yellow-deep)}
.stepline{font-size:13px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600;min-height:20px}

/* Panels */
.panel{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--font-display);line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,58px);font-weight:800}
h2{font-size:clamp(26px,4.2vw,38px);font-weight:700}
h3{font-size:21px;font-weight:700}
p{margin:0}
.lead{font-size:19px;color:var(--muted);max-width:60ch}
.stack{display:grid;gap:18px}
.hero{padding-block:40px 10px;display:grid;gap:22px}
.hero-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 24px;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .12s,background .2s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--yellow);color:#141311}
.btn-primary:hover{background:var(--yellow-deep)}
.btn-ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg)}
.btn-ink{background:var(--ink);color:var(--bg)}
.small{font-size:14px;color:var(--faint)}
.mark{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .1em}
.why{max-width:60ch;margin-top:4px;padding:10px 14px;gap:3px}
.why b{font-size:16px}
.why p{color:var(--muted);font-size:15px;line-height:1.5}
.fact{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:8px}
.fact div{border-top:2px solid var(--line-2);padding-top:10px}
.fact b{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1.1}
.fact span{font-size:14px;color:var(--muted)}

/* Questions */
.q{padding-block:18px 10px;display:grid;gap:20px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--radius);padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:border-color .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--fg);transform:translateY(-1px);box-shadow:var(--shadow)}
.opt b{font-size:17px;font-weight:600}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);color:#141311}
.opt[aria-pressed="true"] span{color:#4C4A42}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:6px 0;text-decoration:underline;cursor:pointer;color:var(--muted)}

/* Result */
.verdict{background:var(--ink);color:var(--bg);border-radius:20px;padding:26px 26px 24px;display:grid;gap:14px;margin-top:10px}
.verdict .eyebrow{color:var(--yellow);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.verdict h2{color:var(--bg)}
.verdict p{color:#D8D4C4;max-width:60ch}
.verdict .hero-row{margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted);background:var(--surface)}
.note{border-left:4px solid var(--yellow);padding:12px 16px;background:var(--surface);border-radius:0 12px 12px 0;display:grid;gap:6px}
.note.warn{border-left-color:var(--warn)}
.note.block{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.heads{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
.heads::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow-deep)}
.note b{font-weight:600}
.steps{display:grid;gap:28px;margin-top:28px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.step .n{width:44px;height:44px;border-radius:12px;background:var(--yellow);color:#141311;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.step .body{display:grid;gap:12px;min-width:0}
.step .body p{color:var(--muted);max-width:62ch}
.step ul{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.steplink{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s,opacity .2s}
.steplink:hover{opacity:.88}
.steplink:active{transform:translateY(1px)}
.ui{display:inline-block;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:0 7px;font-size:.92em;font-weight:600;color:var(--fg);white-space:nowrap}
.code{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 10px 10px 14px;font-family:var(--font-mono);font-size:14px;flex-wrap:wrap}
.code code{flex:1;min-width:0;overflow-wrap:anywhere}
.copy{border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 12px;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer}
.prompt{background:var(--surface);border:1.5px dashed var(--line-2);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.prompt .pl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.prompt q{quotes:none;font-size:17px}
.prompt.feature{background:color-mix(in srgb,var(--yellow) 22%,var(--surface));border:1.5px solid var(--yellow-deep)}
.prompt.feature .pl{color:var(--fg)}
.prompt.feature q{font-family:var(--font-mono);font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.why .prompt.feature{margin-top:8px;padding:10px 12px;gap:8px}
.why .prompt.feature q{font-size:14px}
.fw .hero .prompt.feature{max-width:64ch}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:14px;color:var(--faint)}
.foot a{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

/* Illustrated screens */
/* First week (challenges) */
.fw .eyebrow,.nextbox .eyebrow{font-family:var(--font-mono);font-size:13px;color:var(--faint);letter-spacing:.04em}
.fw .hero{padding-block:28px 6px}
.fw .hero .linkbtn{justify-self:start;font-size:15px}
.callout{background:var(--ink);color:var(--bg);border-radius:16px;padding:18px 20px;display:grid;gap:6px;max-width:64ch}
.callout b{font-family:var(--font-display);font-size:20px;color:var(--yellow)}
.callout p{color:#D8D4C4}
.fw .note p{color:var(--muted)}
.fw .prompt q{font-family:var(--font-mono);font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.nextbox{margin-top:36px;border:1.5px solid var(--line-2);border-radius:20px;padding:24px;background:var(--surface);display:grid;gap:10px}
.nextbox p{color:var(--muted);max-width:60ch}
.nextbox .hero-row{margin-top:8px}
.alt{border:1.5px dashed var(--line-2);border-radius:14px;padding:12px 16px;display:grid;gap:10px}
.alt summary{cursor:pointer;font-size:15px;color:var(--muted);font-weight:600}
.alt q{quotes:none;font-family:var(--font-mono);font-size:14.5px;line-height:1.6;overflow-wrap:anywhere;display:block}
.approval{border-style:solid;border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--surface));max-width:62ch}
.approval summary{color:var(--fg)}
.approval p{color:var(--muted);font-size:15.5px}
.approval a{font-weight:600;color:var(--fg)}
.pre-item .approval{margin-top:6px}
.scrub{display:grid;gap:10px;margin-top:6px}
.scrub-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.scrub-count{font-family:var(--font-mono);font-size:15px;font-variant-numeric:tabular-nums;color:var(--fg)}
.scrub-count b{font-weight:500;background:var(--ink);color:var(--yellow);padding:2px 7px;border-radius:5px;margin-right:8px}
.track{position:relative;height:30px;margin-inline:7px}
.track .rail{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--line)}
.track .segs{position:absolute;inset:11px 0 auto;height:8px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.track .segs span{border-radius:2px;background:transparent}
.track .segs span.done{background:var(--yellow-deep)}
.track .tick{position:absolute;top:6px;width:1px;height:18px;background:var(--line-2)}
.track .head{position:absolute;top:0;width:0;transition:left .35s ease}
.track .head::before{content:"";position:absolute;left:-1.5px;top:4px;width:3px;height:26px;background:var(--yellow);border-radius:2px;box-shadow:0 0 0 1px #141311}
.track .head::after{content:"";position:absolute;left:-7px;top:0;width:14px;height:10px;background:var(--yellow);border:1px solid #141311;border-radius:3px 3px 7px 7px}
.labels{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-inline:7px}
.labels a{font-family:var(--font-mono);font-size:13px;color:var(--faint);text-decoration:none;text-align:center;padding:2px 0;border-radius:4px;font-variant-numeric:tabular-nums}
.labels a:hover{color:var(--fg)}
.labels a.done{color:var(--fg)}
.reset-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.reset-row .linkbtn{font-size:15px}
.section{display:grid;gap:16px;margin-top:44px}
.sec-head{display:grid;gap:6px}
.sec-head p{color:var(--muted);max-width:62ch}
.pre{border:1.5px solid var(--line-2);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.pre-item{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:16px 18px;align-items:start}
.pre-item + .pre-item{border-top:1px solid var(--line)}
.pre-item input{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:24px;height:24px;border:1.5px solid var(--line-2);border-radius:7px;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.pre-item input:checked{background:var(--yellow);border-color:var(--yellow-deep)}
.pre-item input:checked::after{content:"";width:6px;height:11px;border:solid #141311;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.pre-item .txt{display:grid;gap:4px;min-width:0}
.pre-item label{font-weight:600;cursor:pointer}
.pre-item p{color:var(--muted);font-size:15.5px}
.pre-item a,.pre-item .linkbtn{font-weight:600;font-size:15px;justify-self:start;color:var(--fg)}
.cards{display:grid;gap:14px}
.card{border:1.5px solid var(--line-2);border-radius:var(--radius);background:var(--surface);scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)}
.card.is-done{border-color:var(--line)}
.card-h{margin:0}
.toggle{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:16px 18px;cursor:pointer;border-radius:var(--radius)}
.tc{font-family:var(--font-display);font-weight:800;font-size:16px;min-width:34px;text-align:center;background:var(--ink);color:var(--yellow);padding:5px 9px;border-radius:7px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.is-done .tc{background:var(--yellow);color:#141311}
.tt{display:grid;gap:3px;min-width:0}
.tt .name{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.tt .meta{font-size:14px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--font-body);font-weight:500}
.donechip{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:600}
.donechip svg{width:14px;height:14px}
.chev{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:transform .2s}
.chev svg{width:12px;height:12px}
.toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.card-b{padding:2px 18px 20px;display:grid;gap:20px}
.goal{font-size:18px;line-height:1.45;color:var(--fg);background:color-mix(in srgb,var(--yellow) 28%,var(--surface));border-left:4px solid var(--yellow);border-radius:0 12px 12px 0;padding:14px 16px}
.blk{display:grid;gap:8px}
.blk h4{margin:0;font-family:var(--font-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.blk ul,.blk ol{margin:0;padding-left:22px;color:var(--muted);display:grid;gap:6px;max-width:64ch}
.blk ol li::marker{font-family:var(--font-mono);font-size:.85em;color:var(--fg)}
.blk li{padding-left:2px}
.twocol{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.done-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.btn-done[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn-done svg{width:16px;height:16px}
.closing{background:var(--ink);color:var(--bg);border-radius:20px;padding:26px 24px 24px;display:grid;gap:18px;margin-top:44px}
.closing .eyebrow{color:var(--yellow)}
.closing h2{color:var(--bg)}
.closing p{color:color-mix(in srgb,var(--bg) 78%,var(--ink));max-width:60ch}
.fb{display:grid;gap:14px}
.fb label{font-weight:600;display:block;margin-bottom:6px}
.fb textarea{width:100%;min-height:76px;resize:vertical;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:color-mix(in srgb,var(--bg) 8%,var(--ink));color:var(--bg);border:1.5px solid color-mix(in srgb,var(--bg) 35%,var(--ink))}
.fb textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.closing .btn-ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,var(--ink))}
.closing .btn-ghost:hover{border-color:var(--bg)}
.thanks{display:grid;gap:8px;border-left:4px solid var(--yellow);padding:4px 0 4px 16px}
.thanks b{font-family:var(--font-display);font-size:22px}
.contact{border-top:1px solid color-mix(in srgb,var(--bg) 25%,var(--ink));padding-top:18px;display:grid;gap:8px;margin-top:4px}
.contact b{font-family:var(--font-display);font-size:22px}
.contact .btn{justify-self:start}
@media (max-width:560px){
  .toggle{grid-template-columns:auto 1fr;gap:10px 12px;padding:14px}
  .toggle .chev{display:none}
  .tt .name{font-size:19px}
  .card-b{padding:0 14px 18px}
  .labels a{font-size:10.5px}
  .closing{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
@media (max-width:560px){.top{flex-wrap:wrap}.navfw{order:3;flex-basis:100%;justify-content:center;margin-left:0}}
@media (max-width:560px){.step{grid-template-columns:40px 1fr}.step .n{width:34px;height:34px;font-size:16px;border-radius:9px}body{font-size:16px}}
</style>

    ch:[
      {t:"Meet your recording",
       goal:"Get your assistant to tell you what your recording is about, who speaks, and where the best moments are.",
       learn:["Your assistant works from the transcript, the words that were said. It doesn't watch the video.","It answers with times, so you can jump straight to each moment in the editor."],
       steps:["Open a new chat in Claude or ChatGPT and check that Targum is turned on (the + button at the bottom of the chat).","Paste the message below and send it. If you have several recordings, add the name of the one you want.","Read the answer. You should get a short summary, the speakers, and three moments with times like 12:40.","Open the editor, open the same recording, and go to one of those times. Play it and see if you agree."],
       prompt:"Open my latest recording in Targum. In a few sentences, tell me what it's about and who is speaking. Then give me the 3 best moments, with the start and end time of each and one line on why it works.",
       worked:["The summary matches what you remember from the recording.","When you play the times in the editor, they land on the moments it described."],
       tip:"Keep asking. Try \"Why that one?\" or \"Find where we talk about pricing.\" Follow-up questions are where it gets useful.",
       fix:"Your assistant says it can't see Targum: turn Targum on in this chat and ask again. It asks which project: give it the recording's name exactly as it shows in the editor."},
      {t:"Clean it up",
       goal:"Remove stutters, filler words, false starts and long pauses without losing anything you want to keep.",
       learn:["Your assistant only suggests cuts. Nothing is removed until you accept it in the editor.","The clean-up pass costs a few credits. Trimming silences is free."],
       steps:["In the same chat, paste the message below.","If your assistant asks before spending credits on the clean-up, say yes.","Open the recording in the editor. The suggested cuts are marked in the transcript.","Play a few of them. Accept the ones that sound right and reject the ones that cut something you want.","Not sure about one? Leave it. A suggestion you don't accept changes nothing."],
       prompt:"Do a clean-up pass on this recording: find stutters, filler words like \"um\" and \"you know\", and false starts. Also suggest trimming any pause longer than about a second. Just suggest the cuts, I'll review them in the editor. Tell me how many of each you found.",
       worked:["The editor shows marked suggestions waiting for your decision.","After you accept some, playback skips those bits and sounds tighter."],
       tip:"If it feels too aggressive, say \"Only cut the obvious stutters, keep it sounding natural\" and ask again.",
       fix:"You don't see any suggestions in the editor: reload the page. Your assistant stops to ask about credits: that's expected, say yes to continue."},
      {t:"Make your first clip",
       goal:"Turn your strongest moment into a vertical clip of 45 to 60 seconds that you can watch on your phone.",
       learn:["A clip is a candidate. It doesn't change your recording, and you can make as many as you like.","Every clip gets its own link you can open or send to someone."],
       steps:["Paste the message below. If you liked one of the moments from challenge 1, mention it.","Your assistant replies with a title, the clip's length and a link.","Send that link to yourself (a message or an email) and open it on your phone.","Watch it from start to finish. Does it open strong and end on a complete thought?","If not, say what to change in plain words: \"Start 5 seconds later\" or \"End right after the joke.\""],
       prompt:"Make a vertical clip of 45 to 60 seconds from the strongest moment in this recording. It should start with a line that grabs attention and end on a complete thought. Give it a working title and send me the link.",
       worked:["The link opens on your phone and plays your moment, upright.","The clip also shows up next to your recording in the editor."],
       tip:"Ask for three options instead of one, then keep the best. Comparing is faster than describing.",
       fix:"The link says the video is still being prepared: wait a few minutes and open it again. The clip cuts a sentence in half: tell your assistant which words it should start and end on."},
      {t:"Build a clip from several moments",
       goal:"Stitch two or three moments about one topic into a 90-second clip that opens with a hook.",
       learn:["Order matters. You can open with a strong line from later in the recording, then go back.","Be specific about what to keep. Your assistant follows your words closely."],
       steps:["Pick a topic that comes up more than once. Not sure? Ask \"Which topics come up more than once in this recording?\"","Paste the message below and replace [topic] with yours.","Read the plan your assistant gives you: the moments it used, in order, with times.","Open the link and watch. Does each jump make sense?","Adjust in plain words: \"Swap the second and third parts\" or \"Keep the sentence about my first client.\""],
       prompt:"Make a 90-second clip about [topic]. Use 2 or 3 moments from different parts of the recording. Open with a hook: a strong line from later in the recording, then go back and tell it in order. List the moments you used with their times, and send me the link.",
       worked:["The clip plays as one story, with no sentence cut in the middle.","The first line makes you want to keep watching."],
       tip:"If a jump feels abrupt, ask for one more sentence of context before it.",
       fix:"The clip runs long: say what to drop, not just \"make it shorter\". It picked the wrong moments: name the ones you want by their times."},
      {t:"Fix the words",
       goal:"Correct misheard names and terms, label your speakers, and export captions with the right spelling.",
       learn:["Fixes to the transcript carry into your captions and every clip you make.","Speaker names make captions and summaries much easier to follow."],
       steps:["Paste the message below. Add any names you know are tricky: your show, your guest, products, places.","Read the list of fixes it proposes. Say yes to the right ones and correct any it got wrong.","If it asks who is who, tell it: \"Speaker 1 is me, Ana. Speaker 2 is my guest, Luis.\"","Open the recording in the editor and check a few of the corrected names in the transcript.","Export the captions as an SRT file from the editor, and open it to check the spelling."],
       prompt:"Read the transcript and find words that were probably misheard: names of people, brands, places and technical terms. Show me a list of fixes before you apply them. Then label the speakers with their real names. Ask me if you're not sure who is who.",
       worked:["The names are spelled right in the editor's transcript.","The SRT file you exported shows the corrected spelling too."],
       tip:"Give it your spelling list up front, for example \"My guest is Siobhán and the product is called Nuvola.\"",
       fix:"The captions still show the old spelling: make sure you approved the fixes, then export again."},
      {t:"Ship it",
       goal:"Render your best clip as a finished video with captions and a title card, and download it.",
       learn:["Rendering uses credits, and it only works on a clip you've chosen in the editor.","Your assistant waits until the render is finished and tells you when it's ready."],
       steps:["In the editor, look at the clips you made and select the one you like best.","Back in the chat, paste the message below.","Your assistant tells you the cost and asks you to confirm. Say yes.","Wait a few minutes. You can keep working; it will tell you when the video is ready.","Download the video from the link it gives you and watch it on your phone."],
       prompt:"Render the clip I selected in the editor as a vertical video with captions and a short title card at the start. Tell me the cost before you start, wait until the render is finished, then give me the download link.",
       worked:["You have a video file that plays with captions and a title at the start.","It looks right on your phone, upright and readable."],
       tip:"Before rendering, ask \"Show me the captions for this clip\" to catch a typo. Fixing it now is cheaper than rendering twice.",
       fix:"The render is refused: select the clip in the editor first, then ask again. It says you're out of credits: top up in the editor, then repeat the request."}

  editor:[
    {learn:["Targum works from the transcript, the words that were said. Search finds moments by what was said, not by what was on screen.","Every moment has a time, so you can jump straight to it."],
     steps:["Open the editor and open your recording. Wait until the transcript is in.","Read the first screen: the summary and the speakers Targum detected.","Use Search transcript to look for a topic you remember. Click a result to jump to it.","Pick the three moments you'd keep if you could only keep three, and note their times."],
     worked:["You can find any moment you remember in a few seconds, by its words.","The three times you noted land where you expected when you play them."],
     tip:"Search by what was said, not by what you saw. The transcript is the index.",
     fix:"The transcript isn't there yet: wait, long recordings take a few minutes. Search finds nothing: try a single distinctive word instead of a phrase."},
    {learn:["Clean up only suggests cuts. Nothing is removed until you accept it.","The clean-up pass costs a few credits. Trimming silences is free."],
     steps:["Open the recording in the editor and run Clean up.","Confirm the credits when asked. Trimming silences is free.","The suggested cuts appear marked in the transcript.","Play a few. Accept the ones that sound right and reject the ones that remove something you want.","Not sure about one? Leave it. A suggestion you don't accept changes nothing."],
     tip:"Accept in batches: start with the stutters, listen back, then do the pauses.",
     fix:"You don't see any suggestions: reload the page. It asks for credits you don't have: top up in the editor, or trim silences only, which is free."},
    {steps:["In the transcript, select the passage of your strongest moment, 45 to 60 seconds of words.","Click Make clip. Give it a working title.","Set the clip to vertical for your phone.","Open the clip's link on your phone and watch it from start to finish. Does it open strong and end on a complete thought?","If not, adjust the start and end words of the clip and check again."],
     tip:"Make three clips of the same moment with different starts and keep the best. Comparing is faster than fiddling.",
     fix:"The link says the video is still being prepared: wait a few minutes and open it again. The clip cuts a sentence in half: move its start or end to the word before."},
    {learn:["Order matters. You can open with a strong line from later in the recording, then go back.","Be specific about where each passage starts and ends. A sentence boundary is usually right."],
     steps:["Pick a topic that comes up more than once. Search the transcript for it and note two or three passages.","Make a clip from the passage with the strongest line, even if it comes late in the recording. That's your hook.","Add the other passages to the same clip, in the order that tells the story.","Open the link and watch. Does each jump make sense?","Reorder or trim the passages until it plays as one story."],
     tip:"If a jump feels abrupt, extend the earlier passage by one sentence of context.",
     fix:"The clip runs long: drop a passage rather than shaving all of them. A jump sounds wrong: end the passage on a full stop."},
    {steps:["Open the transcript and look for names, brands, places and technical terms that look wrong.","Click a misheard word and type the correction. Targum applies the fix wherever the word repeats.","Rename the speakers with their real names.","Check a few of the corrected names in different parts of the transcript.","Export the captions as an SRT file and open it to check the spelling."],
     tip:"Fix the words before you make more clips: every clip inherits the transcript.",
     fix:"The captions still show the old spelling: make sure the fix was saved, then export again."},
    {learn:["Rendering uses credits, and it only works on a clip you've selected in the editor.","The render runs in the background; the editor shows when it's ready."],
     steps:["In the editor, look at the clips you made and select the one you like best.","Click Render. Choose vertical, captions on, and a short title card at the start.","The editor shows the cost. Confirm it.","Wait a few minutes. You can keep working; the render status shows when the video is ready.","Download the video and watch it on your phone."],
     tip:"Before rendering, read the clip's captions once to catch a typo. Fixing it now is cheaper than rendering twice.",
     fix:"Render is greyed out: select the clip first. It says you're out of credits: top up in the editor, then try again."}
  ]

  steps:{
    signin:{t:"Crea tu cuenta de Targum", p:"Inicia sesión con Google. Es la misma cuenta que aprobarás cuando el asistente pida acceso.", link:{href:CONFIG.loginUrl, label:"Abrir targum.video/login"}},
    claude_settings:{t:"Abre Conectores en los ajustes de Claude", p:"En la web o la app de escritorio, abre el menú de tu perfil, luego Settings y después Connectors. Baja hasta el final y pulsa Add custom connector.", link:{href:CONFIG.claudeConnectorsUrl, label:"Abrir Claude › Settings › Connectors"}},
    claude_add:{t:"Pega la dirección del servidor de Targum", p:"En el diálogo, introduce la URL de abajo como URL del servidor MCP remoto. No toques Advanced settings; Targum usa OAuth, así que no hay client ID ni secret. Pulsa Add."},
    oauth:{t:"Aprueba el acceso", p:"Se abre una ventana de Targum. Inicia sesión con Google y aprueba los permisos. Por defecto el asistente puede leer, sugerir y gastar un poco en análisis; vuelve a preguntar antes de subir, renderizar o borrar."},
    claude_enable:{t:"Activa Targum en un chat", p:"Abre un chat nuevo. Pulsa el botón + abajo a la izquierda, elige Connectors y activa Targum. Se queda activado para esa conversación.", link:{href:CONFIG.claudeNewChatUrl, label:"Abrir un chat nuevo en Claude"}},
    gpt_dev:{t:"Activa el modo desarrollador", p:"En chatgpt.com, abre Settings y luego Connectors (a veces aparece como Apps). Entra en Advanced settings y activa Developer mode. Añade los conectores primero en la web; las apps de escritorio y móvil los recogen después.", link:{href:CONFIG.chatgptConnectorsUrl, label:"Abrir ChatGPT › Settings › Connectors"}},
    gpt_create:{t:"Crea el conector de Targum", p:"De vuelta en Connectors, pulsa Create. Ponle el nombre Targum, pega la URL del servidor de abajo, elige autenticación OAuth, marca la casilla de confianza y pulsa Create.", link:{href:CONFIG.chatgptConnectorsUrl, label:"Abrir ChatGPT › Settings › Connectors"}},
    gpt_enable:{t:"Úsalo en un chat", p:"En un chat nuevo, pulsa +, luego More, después Developer mode y elige Targum. ChatGPT muestra cada llamada a herramienta antes de ejecutarla; confírmala.", link:{href:CONFIG.chatgptNewChatUrl, label:"Abrir un chat nuevo en ChatGPT"}},
    upload:{t:"Añade tu primera grabación", p:"Abre el editor y arrastra un archivo de vídeo o audio. Targum lo transcribe; puedes empezar a editar en cuanto esté la transcripción, antes de que termine de preparar el vídeo. Ojo: los enlaces de YouTube y los directos no se importan. Descarga el archivo primero.", link:{href:CONFIG.editorUrl, label:"Abrir el editor de Targum"}},
    editor_tour:{t:"Prueba los tres movimientos básicos", p:"Busca un tema en la transcripción, ejecuta Clean up para marcar tartamudeos y muletillas, y haz un clip de cualquier pasaje. No se corta nada hasta que lo aceptes."},
    guide:{t:"Deja que tu asistente te enseñe Targum", p:"No hace falta aprender Targum antes. Pega esto y tu asistente toma el mando: te explica qué puede hacer con tus grabaciones, te propone por dónde empezar y te guía en cada paso. Pregúntale lo que quieras por el camino."},
    first_prompt:{t:"Cuando quieras, pide una edición de verdad", p:"Habla con el asistente en lenguaje natural. Encuentra los momentos, propone cortes y clips, y espera tu decisión."}
  },

  done:"Hecho", markDone:"Marcar como hecho", isDone:"Hecho. ¿Deshacer?", next:"Siguiente reto",
    allDoneToast:"Los seis, hechos. Buen trabajo.",
    ch:[
      {t:"Conoce tu grabación",
       goal:"Que tu asistente te cuente de qué va tu grabación, quién habla y dónde están los mejores momentos.",
       learn:["Tu asistente trabaja con la transcripción, con lo que se dijo. No ve el vídeo.","Te responde con tiempos, así que puedes ir directo a cada momento en el editor."],
       steps:["Abre un chat nuevo en Claude o ChatGPT y comprueba que Targum está activado (el botón + de abajo del chat).","Pega el mensaje de abajo y envíalo. Si tienes varias grabaciones, añade el nombre de la que quieres.","Lee la respuesta. Deberías ver un resumen corto, quién habla y tres momentos con tiempos como 12:40.","Abre el editor, entra en la misma grabación y ve a uno de esos tiempos. Escúchalo y mira si estás de acuerdo."],
       prompt:"Abre mi última grabación en Targum. En pocas frases, cuéntame de qué trata y quién habla. Luego dame los 3 mejores momentos, con el tiempo de inicio y de fin de cada uno y una frase sobre por qué funciona.",
       worked:["El resumen coincide con lo que recuerdas de la grabación.","Al reproducir esos tiempos en el editor, caen justo en los momentos que describió."],
       tip:"Sigue preguntando. Prueba con \"¿Por qué ese?\" o \"Busca dónde hablamos de precios\". Lo útil está en las preguntas de seguimiento.",
       fix:"Tu asistente dice que no ve Targum: actívalo en este chat y vuelve a preguntar. Te pregunta qué proyecto: dile el nombre de la grabación tal como aparece en el editor."},
      {t:"Déjala limpia",
       goal:"Quitar tartamudeos, muletillas, frases que empiezan en falso y pausas largas sin perder nada que quieras conservar.",
       learn:["Tu asistente solo sugiere cortes. No se quita nada hasta que lo aceptas en el editor.","La limpieza cuesta unos pocos créditos. Recortar silencios es gratis."],
       steps:["En el mismo chat, pega el mensaje de abajo.","Si tu asistente te pregunta antes de gastar créditos en la limpieza, dile que sí.","Abre la grabación en el editor. Los cortes sugeridos aparecen marcados en la transcripción.","Escucha unos cuantos. Acepta los que suenan bien y rechaza los que se llevan algo que quieres.","¿Dudas con alguno? Déjalo. Una sugerencia que no aceptas no cambia nada."],
       prompt:"Haz una limpieza de esta grabación: busca tartamudeos, muletillas como \"eh\" o \"o sea\" y falsos comienzos. Sugiere también recortar las pausas de más de un segundo, más o menos. Solo sugiere los cortes, yo los reviso en el editor. Dime cuántos has encontrado de cada tipo.",
       worked:["El editor muestra sugerencias marcadas esperando tu decisión.","Después de aceptar algunas, la reproducción se salta esos trozos y suena más ágil."],
       tip:"Si te parece demasiado agresivo, dile \"Corta solo los tartamudeos claros, que suene natural\" y pídelo otra vez.",
       fix:"No ves sugerencias en el editor: recarga la página. Tu asistente se para a preguntarte por los créditos: es normal, dile que sí para seguir."},
      {t:"Haz tu primer clip",
       goal:"Convertir tu mejor momento en un clip vertical de 45 a 60 segundos que puedas ver en el móvil.",
       learn:["Un clip es una propuesta. No cambia tu grabación y puedes hacer tantos como quieras.","Cada clip tiene su propio enlace para abrirlo o mandárselo a alguien."],
       steps:["Pega el mensaje de abajo. Si te gustó alguno de los momentos del reto 1, menciónalo.","Tu asistente te responde con un título, la duración del clip y un enlace.","Mándate ese enlace (por mensaje o por correo) y ábrelo en el móvil.","Míralo entero. ¿Empieza con fuerza y acaba con una idea completa?","Si no, di qué cambiar con tus palabras: \"Empieza 5 segundos después\" o \"Termina justo después del chiste\"."],
       prompt:"Haz un clip vertical de 45 a 60 segundos con el momento más fuerte de esta grabación. Que empiece con una frase que enganche y termine con una idea completa. Ponle un título provisional y mándame el enlace.",
       worked:["El enlace se abre en el móvil y reproduce tu momento en vertical.","El clip también aparece junto a tu grabación en el editor."],
       tip:"Pide tres opciones en vez de una y quédate con la mejor. Comparar es más rápido que describir.",
       fix:"El enlace dice que el vídeo aún se está preparando: espera unos minutos y vuelve a abrirlo. El clip corta una frase a la mitad: dile a tu asistente con qué palabras debe empezar y terminar."},
      {t:"Monta un clip con varios momentos",
       goal:"Unir dos o tres momentos sobre un mismo tema en un clip de 90 segundos que empiece con gancho.",
       learn:["El orden importa. Puedes abrir con una frase fuerte de más adelante y luego volver atrás.","Concreta qué quieres conservar. Tu asistente sigue tus palabras al pie de la letra."],
       steps:["Elige un tema que salga más de una vez. ¿No lo tienes claro? Pregunta \"¿Qué temas salen más de una vez en esta grabación?\"","Pega el mensaje de abajo y cambia [tema] por el tuyo.","Lee el plan que te da tu asistente: los momentos que ha usado, en orden y con tiempos.","Abre el enlace y míralo. ¿Tiene sentido cada salto?","Ajusta con tus palabras: \"Cambia de orden la segunda y la tercera parte\" o \"Deja la frase sobre mi primer cliente\"."],
       prompt:"Haz un clip de 90 segundos sobre [tema]. Usa 2 o 3 momentos de distintas partes de la grabación. Empieza con un gancho: una frase fuerte de más adelante, y luego vuelve atrás y cuéntalo en orden. Dime qué momentos has usado con sus tiempos y mándame el enlace.",
       worked:["El clip se ve como una sola historia, sin frases cortadas a la mitad.","La primera frase te deja con ganas de seguir viendo."],
       tip:"Si un salto queda brusco, pide una frase más de contexto antes.",
       fix:"El clip se alarga: di qué quitar, no solo \"hazlo más corto\". Ha elegido momentos que no eran: nombra los que quieres por sus tiempos."},
      {t:"Corrige las palabras",
       goal:"Corregir nombres y términos mal transcritos, poner nombre a quien habla y exportar subtítulos bien escritos.",
       learn:["Lo que corriges en la transcripción pasa a tus subtítulos y a todos tus clips.","Con los nombres de quien habla, los subtítulos y los resúmenes se siguen mucho mejor."],
       steps:["Pega el mensaje de abajo. Añade los nombres que sabes que son difíciles: tu programa, tu invitado, productos, lugares.","Lee la lista de correcciones que te propone. Acepta las buenas y corrige las que estén mal.","Si te pregunta quién es quién, díselo: \"El hablante 1 soy yo, Ana. El hablante 2 es mi invitado, Luis.\"","Abre la grabación en el editor y comprueba algunos de los nombres corregidos en la transcripción.","Exporta los subtítulos en formato SRT desde el editor y ábrelos para revisar cómo se escriben."],
       prompt:"Lee la transcripción y busca palabras que probablemente se entendieron mal: nombres de personas, marcas, lugares y términos técnicos. Enséñame una lista de correcciones antes de aplicarlas. Después pon a cada hablante su nombre real. Pregúntame si no tienes claro quién es quién.",
       worked:["Los nombres aparecen bien escritos en la transcripción del editor.","El archivo SRT que exportaste también tiene la ortografía corregida."],
       tip:"Dale tu lista de nombres desde el principio, por ejemplo \"Mi invitada es Siobhán y el producto se llama Nuvola\".",
       fix:"Los subtítulos siguen con la ortografía antigua: comprueba que aprobaste las correcciones y vuelve a exportar."},
      {t:"Publícalo",
       goal:"Renderizar tu mejor clip como vídeo terminado, con subtítulos y una cartela de título, y descargarlo.",
       learn:["Renderizar gasta créditos y solo funciona con un clip que hayas elegido en el editor.","Tu asistente espera a que termine el render y te avisa cuando está listo."],
       steps:["En el editor, mira los clips que has hecho y selecciona el que más te guste.","Vuelve al chat y pega el mensaje de abajo.","Tu asistente te dice cuánto cuesta y te pide confirmación. Dile que sí.","Espera unos minutos. Puedes seguir con otra cosa; te avisará cuando el vídeo esté listo.","Descarga el vídeo desde el enlace que te da y míralo en el móvil."],
       prompt:"Renderiza el clip que he seleccionado en el editor como vídeo vertical, con subtítulos y una cartela corta con el título al principio. Dime el coste antes de empezar, espera a que termine el render y luego dame el enlace de descarga.",
       worked:["Tienes un archivo de vídeo con subtítulos y un título al principio.","Se ve bien en el móvil, en vertical y fácil de leer."],
       tip:"Antes de renderizar, pide \"Enséñame los subtítulos de este clip\" para pillar alguna errata. Corregirla ahora sale más barato que renderizar dos veces.",
       fix:"Rechaza el render: selecciona primero el clip en el editor y vuelve a pedirlo. Dice que no te quedan créditos: recarga en el editor y repite la petición."}
    ],

  editor:[
    {learn:["Targum trabaja con la transcripción, con lo que se dijo. La búsqueda encuentra momentos por las palabras, no por lo que salía en pantalla.","Cada momento tiene un tiempo, así que puedes ir directo a él."],
     steps:["Abre el editor y entra en tu grabación. Espera a que esté la transcripción.","Lee la primera pantalla: el resumen y los hablantes que ha detectado Targum.","Usa Buscar en la transcripción para localizar un tema que recuerdes. Pulsa un resultado para saltar a él.","Elige los tres momentos que conservarías si solo pudieras quedarte con tres y apunta sus tiempos."],
     worked:["Encuentras cualquier momento que recuerdes en unos segundos, por sus palabras.","Los tres tiempos que apuntaste caen donde esperabas al reproducirlos."],
     tip:"Busca por lo que se dijo, no por lo que viste. La transcripción es el índice.",
     fix:"La transcripción aún no está: espera, las grabaciones largas tardan unos minutos. La búsqueda no encuentra nada: prueba con una sola palabra distintiva en vez de una frase."},
    {learn:["Clean up solo sugiere cortes. No se quita nada hasta que lo aceptas.","La limpieza cuesta unos pocos créditos. Recortar silencios es gratis."],
     steps:["Abre la grabación en el editor y ejecuta Clean up.","Confirma los créditos cuando te lo pida. Recortar silencios es gratis.","Los cortes sugeridos aparecen marcados en la transcripción.","Escucha unos cuantos. Acepta los que suenan bien y rechaza los que se llevan algo que quieres.","¿Dudas con alguno? Déjalo. Una sugerencia que no aceptas no cambia nada."],
     tip:"Acepta por tandas: primero los tartamudeos, escucha, y luego las pausas.",
     fix:"No ves sugerencias: recarga la página. Pide créditos que no tienes: recarga en el editor, o recorta solo silencios, que es gratis."},
    {steps:["En la transcripción, selecciona el pasaje de tu mejor momento: de 45 a 60 segundos de palabras.","Pulsa Make clip. Ponle un título provisional.","Pon el clip en vertical para el móvil.","Abre el enlace del clip en el móvil y míralo entero. ¿Empieza con fuerza y acaba con una idea completa?","Si no, ajusta la palabra de inicio y la de fin del clip y vuelve a mirarlo."],
     tip:"Haz tres clips del mismo momento con distintos inicios y quédate con el mejor. Comparar es más rápido que retocar.",
