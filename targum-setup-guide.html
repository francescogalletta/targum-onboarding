<style>
/* Layout: one centered column; a yellow "tape" band marks the active step, like a timeline scrubber. */
:root{
  --yellow:#FBDE4B; --yellow-deep:#E7C51D; --ink:#141311; --ink-2:#4C4A42; --ink-3:#8A877B;
  --bg:#FFFDF5; --surface:#FFFFFF; --line:#E9E4CF; --line-2:#D6D0B3;
  --fg:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3);
  --ok:#1F7A4D; --warn:#A8600A;
  --screen-bg:#F6F4EA; --screen-chrome:#FFFFFF; --screen-line:#DAD6C4; --screen-ink:#2A2924; --screen-dim:#B7B3A2;
  --font-display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",sans-serif;
  --font-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px; --shadow:0 1px 0 rgba(20,19,17,.05),0 10px 30px -12px rgba(20,19,17,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#F3F0E4; --ink-2:#C9C5B4; --ink-3:#8E8A79; --bg:#131210; --surface:#1C1B18; --line:#2C2A24; --line-2:#3B3830;
  --fg:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3); --ok:#5CC48C; --warn:#E3A24A;
  --screen-bg:#1F1E1A; --screen-chrome:#272620; --screen-line:#3B3930; --screen-ink:#ECE8DA; --screen-dim:#6B685C;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark } }
:root[data-theme="dark"]{
  --ink:#F3F0E4; --ink-2:#C9C5B4; --ink-3:#8E8A79; --bg:#131210; --surface:#1C1B18; --line:#2C2A24; --line-2:#3B3830;
  --fg:var(--ink); --muted:var(--ink-2); --faint:var(--ink-3); --ok:#5CC48C; --warn:#E3A24A;
  --screen-bg:#1F1E1A; --screen-chrome:#272620; --screen-line:#3B3930; --screen-ink:#ECE8DA; --screen-dim:#6B685C;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 72px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .t{width:34px;height:34px;border-radius:9px;background:var(--yellow);color:#141311;display:grid;place-items:center;font-size:20px;font-weight:800}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Progress tape */
.tape{display:flex;gap:6px;margin:22px 0 8px}
.tape span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.tape span.on{background:var(--yellow)}
.tape span.done{background:var(--yellow-deep)}
.stepline{font-size:13px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-weight:600;min-height:20px}

/* Panels */
.panel{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--font-display);line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,58px);font-weight:800}
h2{font-size:clamp(26px,4.2vw,38px);font-weight:700}
h3{font-size:21px;font-weight:700}
p{margin:0}
.lead{font-size:19px;color:var(--muted);max-width:60ch}
.stack{display:grid;gap:18px}
.hero{padding-block:40px 10px;display:grid;gap:22px}
.hero-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 24px;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .12s,background .2s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--yellow);color:#141311}
.btn-primary:hover{background:var(--yellow-deep)}
.btn-ghost{background:transparent;border:1.5px solid var(--line-2);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg)}
.btn-ink{background:var(--ink);color:var(--bg)}
.small{font-size:14px;color:var(--faint)}
.mark{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .1em}
.fact{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:8px}
.fact div{border-top:2px solid var(--line-2);padding-top:10px}
.fact b{display:block;font-family:var(--font-display);font-size:26px;font-weight:800;line-height:1.1}
.fact span{font-size:14px;color:var(--muted)}

/* Questions */
.q{padding-block:18px 10px;display:grid;gap:20px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--radius);padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:border-color .15s,transform .12s,box-shadow .15s}
.opt:hover{border-color:var(--fg);transform:translateY(-1px);box-shadow:var(--shadow)}
.opt b{font-size:17px;font-weight:600}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--yellow);color:#141311}
.opt[aria-pressed="true"] span{color:#4C4A42}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:6px 0;text-decoration:underline;cursor:pointer;color:var(--muted)}

/* Result */
.verdict{background:var(--ink);color:var(--bg);border-radius:20px;padding:26px 26px 24px;display:grid;gap:14px;margin-top:10px}
.verdict .eyebrow{color:var(--yellow);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.verdict h2{color:var(--bg)}
.verdict p{color:#D8D4C4;max-width:60ch}
.verdict .hero-row{margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted);background:var(--surface)}
.note{border-left:4px solid var(--yellow);padding:12px 16px;background:var(--surface);border-radius:0 12px 12px 0;display:grid;gap:6px}
.note.warn{border-left-color:var(--warn)}
.note.block{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.heads{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
.heads::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow-deep)}
.note b{font-weight:600}
.steps{display:grid;gap:28px;margin-top:28px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.step .n{width:44px;height:44px;border-radius:12px;background:var(--yellow);color:#141311;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.step .body{display:grid;gap:12px;min-width:0}
.step .body p{color:var(--muted);max-width:62ch}
.step ul{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}
.ui{display:inline-block;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:0 7px;font-size:.92em;font-weight:600;color:var(--fg);white-space:nowrap}
.code{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 10px 10px 14px;font-family:var(--font-mono);font-size:14px;flex-wrap:wrap}
.code code{flex:1;min-width:0;overflow-wrap:anywhere}
.copy{border:0;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 12px;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer}
.prompt{background:var(--surface);border:1.5px dashed var(--line-2);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.prompt .pl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.prompt q{quotes:none;font-size:17px}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:18px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:14px;color:var(--faint)}
.foot a{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}

/* Illustrated screens */
.shot{position:relative;background:var(--screen-bg);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);max-width:100%}
.shot svg{display:block;width:100%;height:auto;font-family:var(--font-body)}
.shot .cap{position:absolute;left:10px;bottom:10px;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 9px;border-radius:999px;font-weight:600;opacity:.92}
.shot .ring{animation:ring 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes ring{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.shot .cursor{animation:cur 2.4s ease-in-out infinite}
@keyframes cur{0%{transform:translate(-70px,50px);opacity:0}25%{opacity:1}55%,100%{transform:translate(0,0);opacity:1}}
.shot .typing{animation:typing 2.8s steps(28) infinite}
@keyframes typing{0%,15%{clip-path:inset(0 100% 0 0)}75%,100%{clip-path:inset(0 0 0 0)}}
.shot .blink{animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.shot .toggle-knob{animation:knob 2.4s ease-in-out infinite}
@keyframes knob{0%,40%{transform:translateX(0)}60%,100%{transform:translateX(14px)}}
.shot .toggle-track{animation:track 2.4s ease-in-out infinite}
@keyframes track{0%,40%{fill:var(--screen-dim)}60%,100%{fill:var(--ok)}}
.shot .appear{animation:appear 2.4s ease-in-out infinite}
@keyframes appear{0%,45%{opacity:0;transform:translateY(6px)}60%,100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.shot *{animation:none!important}.shot .typing{clip-path:none}.shot .toggle-knob{transform:translateX(14px)}.shot .toggle-track{fill:var(--ok)}.shot .appear{opacity:1}.panel{animation:none}}
@media (max-width:560px){.step{grid-template-columns:40px 1fr}.step .n{width:34px;height:34px;font-size:16px;border-radius:9px}body{font-size:16px}}
</style>

/* ---------- Analytics + storage ---------- */
function sid(){ try{ let s=localStorage.getItem("targum-guide-sid"); if(!s){ s=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)); localStorage.setItem("targum-guide-sid",s);} return s; }catch(e){ return window.__sid||(window.__sid="s"+Date.now().toString(36)); } }
const SID = sid();
let claudeDb = null; (async()=>{ try{ if(window.claude&&window.claude.use){ claudeDb = await window.claude.use("db"); } }catch(e){ claudeDb=null; } })();
async function post(path, body, extraHeaders={}){
  const r = await fetch(CONFIG.supabaseUrl + path, { method:"POST", headers:{ "apikey":CONFIG.supabaseKey, "Authorization":"Bearer "+CONFIG.supabaseKey, "Content-Type":"application/json", "Prefer":"return=minimal", ...extraHeaders }, body: JSON.stringify(body), keepalive:true });
  if(!r.ok) throw new Error("http "+r.status);
}
function queueLocal(kind, row){ try{ const k="targum-guide-queue"; const q=JSON.parse(localStorage.getItem(k)||"[]"); q.push({kind,row,t:Date.now()}); localStorage.setItem(k, JSON.stringify(q.slice(-200))); }catch(e){} }
async function track(event, step, value){
  const row = { session_id:SID, event, step:step||null, value:value==null?null:String(value), lang:state.lang, path:computePath().key };
  try{ await post("/rest/v1/onboarding_events", row); return; }catch(e){}
  try{ if(claudeDb){ await claudeDb.collection("events").doc(SID+"-"+Date.now().toString(36)).set(row); return; } }catch(e){}
  queueLocal("event", row);
}
async function saveSession(completed){
  const p = { session_id:SID, lang:state.lang, mcp_familiarity:state.a.mcp||null, assistant:state.a.assistant||null, plan:state.a.plan||null, video_editing:state.a.editing||null, content_type:state.a.content||null, path:(state.a.assistant?computePath().key:null), completed:!!completed, user_agent:navigator.userAgent, referrer:document.referrer||null };
  try{ await post("/rest/v1/rpc/upsert_onboarding_session", {p}); return; }catch(e){}
  try{ if(claudeDb){ await claudeDb.collection("sessions").doc(SID).set({...p, updated_at:new Date().toISOString()}); return; } }catch(e){}
  queueLocal("session", p);
}

/* ---------- Path logic ---------- */
function computePath(){
  const a=state.a; const asst=a.assistant; const plan=a.plan;
  if(!asst || asst==="none") return {key:"editor", notes:[]};
  if(asst==="claude" || asst==="both"){
    if(plan==="free") return {key:"editor", notes:["claude_free"], alt:"claude"};
    const notes=[]; if(plan==="team") notes.push("team"); if(plan==="unsure") notes.push("unsure");
    return {key:"claude", notes};
  }
  if(asst==="chatgpt"){
    if(plan==="free") return {key:"editor", notes:["chatgpt_free"]};
    const notes=[]; if(plan==="plus"||plan==="pro") notes.push("chatgpt_consumer"); if(plan==="business") notes.push("chatgpt_business"); if(plan==="unsure") notes.push("unsure");
    return {key:"chatgpt", notes};
  }
  return {key:"editor", notes:[]};
}
